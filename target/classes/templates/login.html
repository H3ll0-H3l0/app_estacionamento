<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <link rel="stylesheet" href="/style.css">

    </head>
    <body>
        <main class="page">
            <section class="card">
                <h1>Bem-vindo de volta</h1>
                <p class="subtitle">Gerencie entradas dos veículos</p>
                <form class="form" method="post" action="/autenticar">
                    <div class="field">
                        <label for="email">E-mail</label>
                        <input class="input" type="email" name="email" id="email" placeholder="voce@email.com" required="">
                    </div>
                    <div class="field">
                        <label for="senha">Senha</label>
                        <input class="input" type="password" name="senha" id="senha" placeholder="Digite sua senha" required="">
                    </div>
                    <button type="submit">Entrar no painel <span>→</span></button>
                </form>
                <div class="divider"></div>
                <p class="helper center">Ainda não tem uma conta? <a href="/cadastro">Cadastrar</a></p>
            </section>
        </main>
    </body>
</html>
